<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <script>
        (function() {
            const token = localStorage.getItem("token");
            if (token) {
                window.location.replace("/task-manager.html");
            } else {
                window.location.replace("/login.html");
            }
        })();
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f6f9;">
    <div style="text-align: center;">
        <p>Redirecting to Task Manager...</p>
    </div>
</body>
</html>
