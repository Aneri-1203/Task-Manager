<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Task Management System</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- Header -->
    <header class="header">
        <div>
            <h1>
                <i class="fa-solid fa-list-check"></i>
                Task Management System
            </h1>
            <p>Manage your daily tasks easily</p>
        </div>
    </header>

    <!-- Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fa-solid fa-key"></i>
            </div>

            <h1>Forgot Password</h1>
            <p class="auth-subtitle">
                Enter your registered email address and we'll send you a link to reset your password.
            </p>

            <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                <!-- Email -->
                <div class="input-group">
                    <label for="email">
                        <i class="fa-solid fa-envelope"></i>
                        Email Address
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- Error / Success Alert Boxes -->
                <div id="forgotError" class="auth-error" style="display: none;"></div>
                <div id="forgotSuccess" class="auth-success" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="auth-button">
                    <i class="fa-solid fa-paper-plane"></i>
                    Send Reset Link
                </button>
            </form>

            <!-- Back to Login -->
            <p class="auth-switch">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

            <div class="back-home">
                <a href="/">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>

        <div class="auth-footer">
            <p>
                <i class="fa-solid fa-shield-halved"></i>
                Your account is securely protected
            </p>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>

</html>
