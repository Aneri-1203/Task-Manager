<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Task Management System</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- Header -->
    <header class="header">
        <div>
            <h1>
                <i class="fa-solid fa-list-check"></i>
                Task Management System
            </h1>
            <p>Manage your daily tasks easily</p>
        </div>
    </header>

    <!-- Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>Reset Password</h1>
            <p class="auth-subtitle">
                Enter your new password below.
            </p>

            <form id="resetForm" onsubmit="handleResetPassword(event)">
                <!-- Hidden Token Field -->
                <input type="hidden" id="resetToken" name="token">

                <!-- New Password -->
                <div class="input-group">
                    <label for="newPassword">
                        <i class="fa-solid fa-lock"></i>
                        New Password
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password (min 6 chars)"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassVisibility('newPassword', 'passIcon1')" aria-label="Toggle password">
                            <i id="passIcon1" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirmPassword">
                        <i class="fa-solid fa-lock"></i>
                        Confirm New Password
                    </label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassVisibility('confirmPassword', 'passIcon2')" aria-label="Toggle password">
                            <i id="passIcon2" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Error / Success Alert Boxes -->
                <div id="resetError" class="auth-error" style="display: none;"></div>
                <div id="resetSuccess" class="auth-success" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" id="resetBtn" class="auth-button">
                    <i class="fa-solid fa-check"></i>
                    Update Password
                </button>
            </form>

            <!-- Back to Login -->
            <p class="auth-switch">
                <a href="login.html">Back to Login</a>
            </p>
        </div>

        <div class="auth-footer">
            <p>
                <i class="fa-solid fa-shield-halved"></i>
                Your account is securely protected
            </p>
        </div>
    </div>

    <script src="reset-password.js"></script>
</body>

</html>
