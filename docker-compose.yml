version: '3.8'

# ============================================================================
# Docker Compose Orchestration File - Task Management Application
# Practical 11: Containerization with Docker and Docker Compose
# Services: Frontend (React 5173) | Backend (Express 5000) | Database (MongoDB 27017)
# Network: app-network (bridge) | Persistent Volume: mongo-data
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # --------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: task-manager-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=taskdb
    volumes:
      # Supplementary Problem: Named volume for data persistence across restarts
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # 2. Node.js Express Backend API Service
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Referencing MongoDB container via its Compose service name (not localhost)
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=supersecret_jwt_key_task_manager_awdf_2026_secure
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # 3. React (Vite) Frontend Single Page Application Service
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      # Directs internal proxying to the backend service name on app-network
      - VITE_BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app-network

# ----------------------------------------------------------------------------
# Named Volumes (Data Persistence)
# ----------------------------------------------------------------------------
volumes:
  mongo-data:
    name: task-manager-mongo-data
    driver: local

# ----------------------------------------------------------------------------
# Internal Bridge Network (Inter-Container DNS & Communication)
# ----------------------------------------------------------------------------
networks:
  app-network:
    name: task-manager-app-network
    driver: bridge
